info:
  title: Maintainerr API
  description: API documentation for Maintainerr
  version: '1.0'
  contact: {}
tags:
  - name: maintainerr
    description: ''
servers:
  - url: <maintainerr_url>:<port>/api
components:
  schemas:
    LivenessResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        uptimeSeconds:
          type: number
        timestamp:
          type: string
          format: date-time
      required:
        - status
        - uptimeSeconds
        - timestamp
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        uptimeSeconds:
          type: number
        database:
          type: string
          enum:
            - ok
            - unreachable
        timestamp:
          type: string
          format: date-time
      required:
        - status
        - uptimeSeconds
        - database
        - timestamp
    SettingDto:
      type: object
      properties: {}
    DownloadClientSetting:
      type: object
      properties:
        download_client_url:
          type: string
        download_client_username:
          type: string
          default: ''
        download_client_password:
          type: string
          default: ''
        download_client_delete_data:
          type: boolean
        download_client_fallback_ratio:
          type: number
          minimum: 0.5
      required:
        - download_client_url
        - download_client_delete_data
        - download_client_fallback_ratio
    EmbySetting:
      type: object
      properties:
        emby_url:
          type: string
        emby_api_key:
          type: string
        emby_user_id:
          type: string
      required:
        - emby_url
        - emby_api_key
    EmbyLoginRequest:
      type: object
      properties:
        emby_url:
          type: string
        username:
          type: string
        password:
          type: string
      required:
        - emby_url
        - username
        - password
    StreamystatsSetting:
      type: object
      properties:
        url:
          type: string
      required:
        - url
    StreamystatsInfoResponse:
      type: object
      properties:
        url:
          type: string
        serverId:
          type: number
          nullable: true
      required:
        - url
        - serverId
    StreamystatsUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
      required:
        - id
    StreamystatsItemUserStats:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/StreamystatsUser'
        watchCount:
          type: number
        totalWatchTime:
          type: number
        completionRate:
          type: number
        firstWatched:
          type: string
          nullable: true
        lastWatched:
          type: string
          nullable: true
      required:
        - user
        - watchCount
        - totalWatchTime
        - completionRate
        - firstWatched
        - lastWatched
    StreamystatsItemWatchHistory:
      type: object
      properties:
        user:
          allOf:
            - $ref: '#/components/schemas/StreamystatsUser'
          nullable: true
        watchDate:
          type: string
        watchDuration:
          type: number
        completionPercentage:
          type: number
        playMethod:
          type: string
          nullable: true
        deviceName:
          type: string
          nullable: true
        clientName:
          type: string
          nullable: true
      required:
        - user
        - watchDate
        - watchDuration
        - completionPercentage
    StreamystatsItemWatchCountByMonth:
      type: object
      properties:
        month:
          type: number
        year:
          type: number
        watchCount:
          type: number
        uniqueUsers:
          type: number
        totalWatchTime:
          type: number
      required:
        - month
        - year
        - watchCount
        - uniqueUsers
        - totalWatchTime
    StreamystatsSeriesEpisodeStats:
      type: object
      properties:
        totalSeasons:
          type: number
        totalEpisodes:
          type: number
        watchedEpisodes:
          type: number
        watchedSeasons:
          type: number
      required:
        - totalSeasons
        - totalEpisodes
        - watchedEpisodes
        - watchedSeasons
    StreamystatsItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
      required:
        - id
    StreamystatsItemDetails:
      type: object
      properties:
        item:
          $ref: '#/components/schemas/StreamystatsItem'
        totalViews:
          type: number
        totalWatchTime:
          type: number
        completionRate:
          type: number
        firstWatched:
          type: string
          nullable: true
        lastWatched:
          type: string
          nullable: true
        usersWatched:
          type: array
          items:
            $ref: '#/components/schemas/StreamystatsItemUserStats'
        watchHistory:
          type: array
          items:
            $ref: '#/components/schemas/StreamystatsItemWatchHistory'
        watchCountByMonth:
          type: array
          items:
            $ref: '#/components/schemas/StreamystatsItemWatchCountByMonth'
        episodeStats:
          allOf:
            - $ref: '#/components/schemas/StreamystatsSeriesEpisodeStats'
          nullable: true
      required:
        - item
        - totalViews
        - totalWatchTime
        - completionRate
        - firstWatched
        - lastWatched
        - usersWatched
        - watchHistory
        - watchCountByMonth
    CronScheduleDto:
      type: object
      properties: {}
    CollectionVisibilitySettings:
      type: object
      properties:
        libraryId:
          type: string
        collectionId:
          type: string
        ownHome:
          type: boolean
        sharedHome:
          type: boolean
        recommended:
          type: boolean
    RulesDto:
      type: object
      properties: {}
    CommunityRule:
      type: object
      properties: {}
