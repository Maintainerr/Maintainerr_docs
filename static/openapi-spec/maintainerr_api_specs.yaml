    get:
      operationId: CollectionsController_getCollectionPoster
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: Returns the stored JPEG bytes.
        '404':
          description: No custom poster on this collection.
      summary: Stream the user-uploaded poster bytes for a collection. 404 when none.
      tags:
        - Collections
    post:
      operationId: CollectionsController_uploadCollectionPoster
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '201':
          description: Returns { pushed, attempted } so clients can distinguish a deferred local save from an attempted live media-server push.
          content:
            application/json:
              schema:
                type: object
                required:
                  - pushed
                  - attempted
                properties:
                  pushed:
                    type: boolean
                    description: True when the live media-server upload succeeded during this request.
                  attempted:
                    type: boolean
                    description: True when Maintainerr attempted a live media-server upload during this request.
      summary: Upload a custom collection poster. Stored locally and pushed to the media server (best-effort). 500 KB max.
      tags:
        - Collections
    delete:
      operationId: CollectionsController_deleteCollectionPoster
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: Returns whether the local poster was cleared and whether Maintainerr successfully requested a media-server metadata refresh.
          content:
            application/json:
              schema:
                type: object
                required:
                  - cleared
                  - refreshRequested
                properties:
                  cleared:
                    type: boolean
                    description: True when the stored local poster file was removed.
                  refreshRequested:
                    type: boolean
                    description: True when Maintainerr successfully sent a metadata refresh request to the current media server. This does not guarantee that artwork will change.
      summary: Clear the stored custom poster and request a best-effort metadata refresh on the media server. Artwork may or may not change depending on the configured server behavior and agents.
      tags:
        - Collections
