paths:
  /api/health:
    get:
      operationId: HealthController_health
      parameters: []
      responses:
        '200':
          description: Combined readiness check. Returns database status when reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Combined readiness check. Returned when the database is unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      tags:
        - /health
  /api/health/live:
    get:
      operationId: HealthController_live
