#[project.extra.analytics]
#provider = "matomo"
#property = "docs"
[project.extra.analytics.feedback]
title = "Was this page helpful?"
[[project.extra.analytics.feedback.ratings]]
icon = "fontawesome/solid/thumbs-up"
name = "This page was helpful"
note = """
    Thanks for your feedback!
    """
[[project.extra.analytics.feedback.ratings]]
icon = "fontawesome/solid/thumbs-down"
name = "This page could be improved"
note = """
    Thanks for your feedback! Help us improve this page by
    submitting an issue to the docs repo. <a href="https=//github.com/ydkmlt84/Maintainerr_docs/issues/new/choose" target="_blank">Docs Repo New Issue</a>
    """
[project.extra.consent.cookies]
analytics = "Maintainerr's self-hosted analytics system (Matomo)."
[project.extra.consent]
actions = ["accept", "reject"]
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/maintainerr/maintainerr"
name = "Github"
[[project.extra.social]]
icon = "fontawesome/brands/docker"
link = "https://hub.docker.com/r/jorenn92/maintainerr/"
name = "Docker Hub"
[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.maintainerr.info"
name = "Discord"
[[project.extra.social]]
icon = "material/cookie-cog"
link = "#__consent"
name = "Cookie Settings"
[[project.extra.social]]
icon = "material/gavel"
link = "https://github.com/Maintainerr/Maintainerr/blob/main/LICENSE"
name = "License"

[project.extra.status]
new = "Recently Added"
deprecated = "Deprecated"
recent = "New Updates"
# version=
#    provider= mike
# default= latest

## Extensions
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true

## Markdown Extensions
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
[project.markdown_extensions.pymdownx.highlight]
line_spans = "__span"
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "!!python/name=pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
#[project.markdown_extensions.pymdownx.tabbed.slugify]
#kwds = { case = "lower" }
#object = "pymdownx.slugs.slugify"
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]


