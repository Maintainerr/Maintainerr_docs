# Project information
[project]
site_name = "Maintainerr Documentation"
site_url = "https://docs.maintainerr.info/"
site_author = "ydkmlt84"
site_description = "Documentation for the wildly popular Maintainerr project."
use_directory_urls = true
# Repository
repo_name = "maintainerr/maintainerr"
repo_url = "https://github.com/maintainerr/maintainerr"
copyright = "Copyright &copy; Jorenn92"
# Extras
extra_css = ["docs/assets/stylesheets"]
# extra_javascript = ["docs/assets/javascripts/swagger-ui-bundle.js"]

# Configuration
## Theme Setup
[project.theme]
font.text = "Roboto"
font.code = "Roboto Mono"
favicon = "images/favicon.ico"
logo = "images/logo_icon.svg"
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "content.footnote.tooltips",
  "content.tabs.link",
  # - header.autohide
  # - navigation.expand
  "navigation.indexes",
  #- navigation.instant
  # - navigation.instant.prefetch
  #- navigation.instant.progress
  # - navigation.instant.preview
  # - navigation.path
  # - navigation.prune
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  # - navigation.tracking
  "search.highlight",
  "search.share",
  "toc.follow",
  # - toc.integrate
]
[project.theme.pallete]
primary = "grey"
accent = "orange"
[project.theme.icon]
repo = "material/github"
[[project.theme.palette]]
media = "(prefers-color-scheme= light)"
scheme = "default"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to dark mode"
[[project.theme.palette]]
media = "(prefers-color-scheme= dark)"
scheme = "slate"
toggle.icon = "material/weather-night"
toggle.name = "Switch to light mode"


